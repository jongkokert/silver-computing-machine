<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID DIRECTORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06060b;
    --panel:rgba(255,255,255,.045);
    --panel-hover:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.08);
    --border-hover:rgba(255,255,255,.18);
    --text:#eceaf5;
    --muted:#82809b;
    --accent:#7c5cff;
    --accent2:#00e0c6;
    --radius:18px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html{scroll-behavior:smooth}

  body{
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== BACKGROUND ===== */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }

  .bg::after{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 75%);
  }

  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.5;
    animation:float 18s ease-in-out infinite;
  }

  .orb.a{width:520px;height:520px;background:#5b3df5;top:-220px;left:-140px}
  .orb.b{width:460px;height:460px;background:#00a896;top:20%;right:-180px;animation-delay:-6s}
  .orb.c{width:400px;height:400px;background:#8b2fd6;bottom:-200px;left:35%;animation-delay:-12s;opacity:.35}

  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(40px,-50px,0) scale(1.08)}
    66%{transform:translate3d(-35px,30px,0) scale(.94)}
  }

  /* ===== LAYOUT ===== */
  .wrap{
    position:relative;
    z-index:1;
    max-width:1120px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  /* ===== HEADER ===== */
  .head{
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:44px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:18px;
  }

  .mark{
    position:relative;
    width:60px;
    height:60px;
    flex:none;
    border-radius:20px;
    background:linear-gradient(145deg, rgba(124,92,255,.28), rgba(0,224,198,.14));
    border:1px solid rgba(255,255,255,.14);
    display:grid;
    place-items:center;
    box-shadow:0 0 40px rgba(124,92,255,.35), inset 0 0 22px rgba(0,0,0,.6);
    overflow:hidden;
  }

  .mark::before{
    content:'';
    width:22px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #1a1730, #000 70%);
    box-shadow:0 0 0 3px rgba(124,92,255,.55), 0 0 22px rgba(124,92,255,.85);
    animation:pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(124,92,255,.55),0 0 22px rgba(124,92,255,.85)}
    50%{transform:scale(1.14);box-shadow:0 0 0 5px rgba(124,92,255,.28),0 0 34px rgba(124,92,255,1)}
  }

  h1{
    font-size:clamp(1.65rem,3.4vw,2.4rem);
    font-weight:700;
    letter-spacing:.14em;
    line-height:1.05;
    background:linear-gradient(100deg,#fff 10%,#b9a8ff 48%,#5ee7d5 92%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  h1 span{font-weight:400;opacity:.85}

  .tag{
    margin-top:7px;
    font-size:.86rem;
    color:var(--muted);
    letter-spacing:.02em;
  }

  /* ===== SEARCH ===== */
  .search{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    width:min(340px,100%);
    padding:13px 18px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:border-color .25s, box-shadow .25s, background .25s;
  }

  .search:focus-within{
    border-color:rgba(124,92,255,.6);
    background:rgba(124,92,255,.07);
    box-shadow:0 0 0 4px rgba(124,92,255,.12);
  }

  .search svg{width:17px;height:17px;stroke:var(--muted);flex:none;transition:stroke .25s}
  .search:focus-within svg{stroke:var(--accent)}

  .search input{
    flex:1;
    min-width:0;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font:inherit;
    font-size:.9rem;
    letter-spacing:.02em;
  }

  .search input::placeholder{color:#5b5977}

  /* ===== STATS BAR ===== */
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:26px;
  }

  .chip{
    font-size:.72rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:8px 15px;
    border-radius:999px;
    color:var(--muted);
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
  }

  .chip b{color:var(--accent2);font-weight:600}

  /* ===== GRID ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:16px;
  }

  .card{
    position:relative;
    display:flex;
    gap:15px;
    padding:18px;
    border-radius:var(--radius);
    background:var(--panel);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    transition:transform .3s cubic-bezier(.2,.8,.3,1), border-color .3s, background .3s, box-shadow .3s;
    animation:rise .55s cubic-bezier(.2,.8,.3,1) backwards;
    overflow:hidden;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(18px) scale(.97)}
    to{opacity:1;transform:none}
  }

  .card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%), rgba(124,92,255,.16), transparent 65%);
    opacity:0;
    transition:opacity .35s;
    pointer-events:none;
  }

  .card:hover{
    transform:translateY(-5px);
    border-color:var(--border-hover);
    background:var(--panel-hover);
    box-shadow:0 18px 42px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(124,92,255,.14);
  }

  .card:hover::before{opacity:1}

  /* File icon */
  .ficon{
    position:relative;
    flex:none;
    width:50px;
    height:50px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.09em;
    color:#fff;
    background:linear-gradient(150deg, color-mix(in srgb, var(--c) 42%, transparent), color-mix(in srgb, var(--c) 8%, transparent));
    border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow:0 0 22px -6px var(--c), inset 0 1px 0 rgba(255,255,255,.16);
  }

  /* Card content */
  .info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
    justify-content:center;
  }

  .fname{
    font-size:.93rem;
    font-weight:600;
    letter-spacing:.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .fmeta{
    font-size:.75rem;
    color:var(--muted);
    letter-spacing:.04em;
  }

  .fmeta i{
    font-style:normal;
    color:#4d4b66;
    margin:0 5px;
  }

  /* Download button */
  .dl{
    position:relative;
    align-self:center;
    flex:none;
    padding:11px 17px;
    border-radius:11px;
    border:1px solid rgba(124,92,255,.35);
    background:rgba(124,92,255,.1);
    color:#cfc2ff;
    font:inherit;
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.06em;
    cursor:pointer;
    overflow:hidden;
    transition:background .25s, border-color .25s, color .25s, transform .15s;
    white-space:nowrap;
  }

  .dl:hover:not(:disabled){
    background:rgba(124,92,255,.24);
    border-color:rgba(124,92,255,.75);
    color:#fff;
    box-shadow:0 0 26px -6px rgba(124,92,255,.85);
  }

  .dl:active:not(:disabled){transform:scale(.96)}
  .dl:disabled{cursor:default}

  .dl .label{position:relative;z-index:2}

  .dl .bar{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    z-index:1;
    background:linear-gradient(90deg, rgba(124,92,255,.55), rgba(0,224,198,.5));
    transition:width .12s linear;
  }

  .dl.done{
    border-color:rgba(0,224,198,.6);
    background:rgba(0,224,198,.14);
    color:#7bf5e2;
  }

  /* Empty state */
  .empty{
    display:none;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
    font-size:.9rem;
    letter-spacing:.05em;
    border:1px dashed var(--border);
    border-radius:var(--radius);
  }

  .empty.show{display:block}

  /* Footer */
  footer{
    margin-top:56px;
    padding-top:26px;
    border-top:1px solid var(--border);
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:space-between;
    font-size:.74rem;
    letter-spacing:.08em;
    color:#4d4b66;
    text-transform:uppercase;
  }

  footer b{color:var(--accent);font-weight:600}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:#06060b}
  ::-webkit-scrollbar-thumb{background:#24223a;border-radius:10px;border:2px solid #06060b}
  ::-webkit-scrollbar-thumb:hover{background:#39355c}

  @media (max-width:640px){
    .wrap{padding:36px 16px 60px}
    .head{align-items:stretch}
    .search{width:100%}
    .card{flex-wrap:wrap}
    .dl{width:100%;margin-top:6px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- Background -->
<div class="bg">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
</div>

<main class="wrap">

  <!-- Header -->
  <header class="head">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>VOID <span>DIRECTORY</span></h1>
        <p class="tag">Unduh file dengan cepat, aman, dan tanpa ribet.</p>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="text" placeholder="Cari file…" autocomplete="off">
    </div>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="chip">Total File <b id="count">0</b></div>
    <div class="chip">Server <b>Online</b></div>
    <div class="chip">Status <b>Aman</b></div>
  </div>

  <!-- Grid -->
  <section class="grid" id="grid"></section>
  <p class="empty" id="empty">Tidak ada file yang cocok dengan pencarian.</p>

  <!-- Footer -->
  <footer>
    <span>&copy; 2025 <b>Void Directory</b></span>
    <span>Built with void energy</span>
  </footer>

</main>

<script>
/* ============================================================
   DATA FILE
   Tambahkan properti `url` untuk memakai file asli, contoh:
   { name:'setup.exe', size:'48 MB', ext:'EXE', color:'#7c5cff',
     url:'files/setup.exe' }
   Jika `url` tidak ada, file demo akan dibuat otomatis.
   ============================================================ */
const files = [
  { name: 'void-client-setup.exe', size: '48.2 MB', ext: 'EXE', color: '#7c5cff' },
  { name: 'neon-pack-v3.zip',     size: '312 MB',  ext: 'ZIP', color: '#00e0c6' },
  { name: 'user-manual.pdf',      size: '4.7 MB',  ext: 'PDF', color: '#ff5c7c' },
  { name: 'soundtrack-void.mp3',  size: '11.3 MB', ext: 'MP3', color: '#ffb02e' },
  { name: 'render-config.json',   size: '12 KB',   ext: 'JSON',color: '#4ea8ff' },
  { name: 'wallpaper-4k.png',     size: '18.9 MB', ext: 'PNG', color: '#a86bff' },
  { name: 'source-code.tar.gz',   size: '86.4 MB', ext: 'GZ',  color: '#3ddc84' },
  { name: 'patch-notes.txt',      size: '3 KB',    ext: 'TXT', color: '#9aa0b5' },
];

const grid   = document.getElementById('grid');
const empty  = document.getElementById('empty');
const input  = document.getElementById('search');
const count  = document.getElementById('count');

/* ===== RENDER ===== */
function render(list) {
  grid.innerHTML = '';

  list.forEach((f, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.style.animationDelay = (i * 45) + 'ms';

    card.innerHTML = `
      <div class="ficon" style="--c:${f.color}">${f.ext}</div>
      <div class="info">
        <div class="fname" title="${f.name}">${f.name}</div>
        <div class="fmeta">${f.size}<i>•</i>${f.ext} File</div>
      </div>
      <button class="dl" type="button">
        <span class="bar"></span>
        <span class="label">Download</span>
      </button>
    `;

    /* Efek glow mengikuti kursor */
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });

    /* Tombol download */
    card.querySelector('.dl').addEventListener('click', function () {
      handleDownload(f, this);
    });

    grid.appendChild(card);
  });

  empty.classList.toggle('show', list.length === 0);
  count.textContent = list.length;
}

/* ===== LOGIKA DOWNLOAD ===== */
function handleDownload(file, btn) {
  if (btn.disabled) return;

  btn.disabled = true;
  const label = btn.querySelector('.label');
  const bar   = btn.querySelector('.bar');

  label.textContent = 'Menyiapkan…';

  let progress = 0;
  const timer = setInterval(() => {
    progress = Math.min(100, progress + Math.random() * 16 + 7);
    bar.style.width = progress + '%';

    if (progress >= 100) {
      clearInterval(timer);
      label.textContent = 'Mengunduh…';

      setTimeout(() => {
        triggerDownload(file);

        btn.classList.add('done');
        label.textContent = 'Selesai ✓';

        setTimeout(() => {
          btn.classList.remove('done');
          label.textContent = 'Download';
          bar.style.width = '0%';
          btn.disabled = false;
        }, 1600);

      }, 320);
    }
  }, 110);
}

function triggerDownload(file) {
  let href = file.url;
  let revoke = false;

  if (!href) {
    const content =
      `VOID DIRECTORY\n` +
      `=========================\n` +
      `Nama File : ${file.name}\n` +
      `Ukuran    : ${file.size}\n` +
      `Tipe      : ${file.ext}\n` +
      `Tanggal   : ${new Date().toLocaleString('id-ID')}\n\n` +
      `Ini adalah file contoh yang dihasilkan otomatis.\n` +
      `Ganti dengan file asli di dalam kode (properti "url").\n`;

    const blob = new Blob([content], { type: 'application/octet-stream' });
    href = URL.createObjectURL(blob);
    revoke = true;
  }

  const a = document.createElement('a');
  a.href = href;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();

  if (revoke) setTimeout(() => URL.revokeObjectURL(href), 2000);
}

/* ===== PENCARIAN ===== */
input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  const filtered = q
    ? files.filter(f => f.name.toLowerCase().includes(q) || f.ext.toLowerCase().includes(q))
    : files;
  render(filtered);
});

/* ===== INIT ===== */
render(files);
</script>

</body>
</html>
